name: Build Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build release zip
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Generate zip
        run: |
          rsync -av --exclude-from='.distignore' . ../completionist/
          cd .. && zip -r completionist.zip completionist
          mv completionist.zip $GITHUB_WORKSPACE/

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: completionist.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}